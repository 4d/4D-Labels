# Weekly bump of SHA-pinned GitHub Actions (SHA and "# vX.Y.Z" comment), grouped in a single PR.
# Internal 4d actions track @main on purpose and are ignored.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "4d/gitlabsync-action"
      - dependency-name: "4d/build4d-action"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
