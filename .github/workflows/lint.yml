name: Lint

# Checks that XLIFF, 4DSettings and 4DCatalog files are well-formed XML.

on:
  push:
    paths:
      - '**.xlf'
      - '**.4DSettings'
      - '**.4DCatalog'

  pull_request:
    paths:
      - '**.xlf'
      - '**.4DSettings'
      - '**.4DCatalog'

permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint XML
        run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils
          # shellcheck disable=2046
          find . \( -name "*.xlf" -o -name '*.4DCatalog' -o -name "*.4DSettings" \) -type f -exec xmllint --noout '{}' +
