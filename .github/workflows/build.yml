name: Build

# Compiles the project on macOS and Windows, then mirrors the repository to the internal Git server.
# A successful run on a release branch triggers update_4d_core_submodule.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "Build on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [macOS, Windows]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        lfs: true

    - name: Build
      uses: 4d/build4d-action@main # internal action, intentionally tracks main
      with:
        product-line: vcs
        version: vcs
        build: official
        token: ${{ secrets.DLTK }}

  sync:
    needs: ["build"]
    runs-on: [self-hosted, macOS, ARM64]
    name: Git Repo Sync
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        lfs: true

    - name: Get Internal Sync action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: 4d/gitlabsync-action
        ref: main # internal action, intentionally tracks main
        path: .github/workflows/external/sync
        token: ${{ secrets.CI_GIT_SYNC }}

    - id: Sync
      uses: ./.github/workflows/external/sync/
      with:
        target-url: ${{ secrets.TARGET_URL }}
        target-username: ${{ secrets.TARGET_USERNAME }}
        target-token: ${{ secrets.TARGET_TOKEN }}
